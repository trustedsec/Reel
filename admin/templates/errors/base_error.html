<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Error{% endblock %} - Reel v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="px-6 py-8">
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full {% block icon_bg %}bg-red-100{% endblock %} mb-4">
                    <i class="{% block icon %}fas fa-exclamation-triangle text-red-600{% endblock %} text-xl"></i>
                </div>
                
                <h1 class="text-2xl font-bold text-gray-900 mb-2">
                    {% block error_title %}Error{% endblock %}
                </h1>
                
                <p class="text-gray-600 mb-6">
                    {% block error_message %}Something went wrong{% endblock %}
                </p>
                
                {% block error_details %}{% endblock %}
                
                <div class="flex flex-col sm:flex-row gap-3 justify-center">
                    {% block error_actions %}
                    <button onclick="window.history.back()" 
                            class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        <i class="fas fa-arrow-left mr-2"></i>
                        Go Back
                    </button>
                    <a href="/" 
                       class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        <i class="fas fa-home mr-2"></i>
                        Home
                    </a>
                    {% endblock %}
                </div>
            </div>
        </div>
        
        <div class="px-6 py-3 bg-gray-50 text-center">
            <p class="text-xs text-gray-500">
                {% block error_footer %}Reel v2 - Modern Phishing Framework{% endblock %}
            </p>
        </div>
    </div>
</body>
</html>
