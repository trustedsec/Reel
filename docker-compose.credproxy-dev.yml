services:
  reel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reel-credproxy-dev
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:1234:1234"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:////app/instance/reel.db
      - SECRET_KEY=credproxy-dev-key-not-for-prod
      - JWT_SECRET_KEY=credproxy-jwt-dev-key-not-for-prod
      - LOG_LEVEL=DEBUG
      - ADMIN_HOST=0.0.0.0
      - PHISHING_HOST=0.0.0.0
    volumes:
      - ./app.py:/app/app.py
      - ./cli:/app/cli
      - ./plugins:/app/plugins
      - ./shared:/app/shared
      - ./admin:/app/admin
      - ./api:/app/api
      - ./workflows:/app/workflows
      - ./phishing:/app/phishing
      - ./test_scripts:/app/test_scripts
      - ./storage:/app/storage
      - credproxy-dev-db:/app/instance
    command: ["./start.sh", "--skip-setup"]

  mfa-target:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reel-mfa-target
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - FLASK_HOST=0.0.0.0
    volumes:
      - ./test_scripts:/app/test_scripts
    command: ["uv", "run", "python", "test_scripts/credproxy_mfa_test.py"]

volumes:
  credproxy-dev-db:
